---

- name: Setup nginx web servers
  hosts: webservers
  become: yes
  tasks:
    - name: Install Nginx
      ansible.builtin.apt:
        name: nginx
        state: present
    - name: Create deploy user
      ansible.builtin.user:
        name: deploy
        state: present
    - name: Ensure nginx is running
      ansible.builtin.service:
        name: nginx
        state: started