# -----------------------------------------------------------------------------
# ansible.cfg - project level Ansible configuration
# -----------------------------------------------------------------------------
# Ansible reads this file automatically when you run ansible commands
# from THIS directory, so you don't have to type the same options every time.
#
# Check which config file is in use:   ansible --version
# See every setting you changed:       ansible-config dump --only-changed
# -----------------------------------------------------------------------------

[defaults]
# Default inventory file (instead of typing -i inventory.ini every time)
inventory = ./inventory.ini

# User to SSH as on the managed nodes (same as ansible_user)
remote_user = ansible

# Private key used for SSH login (created in the SSH access step)
private_key_file = ~/.ssh/ansible_lab

# LAB ONLY: don't prompt "Are you sure you want to continue connecting?"
# Lab containers get new host keys every time they are re-created.
# In production keep this True (the default).
host_key_checking = False

# How many servers Ansible works on in parallel (default 5)
forks = 5

# SSH connection timeout in seconds
timeout = 10

# Find Python on managed nodes automatically and don't print a warning about it
interpreter_python = auto_silent

# Show task results in readable YAML instead of one long JSON line
callback_result_format = yaml

[privilege_escalation]
# Don't use sudo by default; we turn it on per play with "become: true"
become = False
become_method = sudo
become_user = root
become_ask_pass = False

[ssh_connection]
# Re-use SSH connections and reduce SSH operations = faster runs
pipelining = True