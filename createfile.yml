---
- name: Create users
  hosts: all
  become: true
  gather_facts: true 

  tasks:
    - name: Create application directory
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - /opt/test
        - /opt/another_dir
        - /opt/external_dir
        - /opt/external_dir/subdir